<style>
.src{float:right;font-family:'JetBrains Mono',monospace;font-size:8.2pt;color:var(--ink-faint);letter-spacing:.02em;margin:0 0 1mm 4mm;white-space:nowrap}
.star{color:var(--amber);font-weight:800;margin-right:3px}
.tline{font-size:9.8pt;color:var(--ink-soft);margin:-1mm 0 2mm}
.pg{display:flex;flex-wrap:wrap;justify-content:space-around;align-items:flex-start;gap:2mm 6mm;margin-top:1.5mm}
