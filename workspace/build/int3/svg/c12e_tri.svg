<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120" font-family="Inter, Arial, sans-serif"><polygon points="22.0,100.0 140.0,100.0 140.0,34.0" fill="#2563eb" fill-opacity="0.12" stroke="#1f2a37" stroke-width="1.5" stroke-linejoin="round"/><path d="M133.0,100.0 L133.0,93.0 L140.0,93.0" fill="none" stroke="#1f2a37" stroke-width="1.1"/><path d="M42.0,100.0 A20,20 0 0 0 39.5,90.3" fill="none" stroke="#1f2a37" stroke-width="1.1"/><text x="47" y="99.85" text-anchor="start" font-size="11" fill="#1f2a37" font-weight="500" font-style="italic">θ</text><text x="81.0" y="118.85" text-anchor="middle" font-size="11" fill="#1f2a37" font-weight="500">√(a² − x²)</text><text x="146" y="75.2" text-anchor="start" font-size="12" fill="#1f2a37" font-weight="500" font-style="italic">x</text><text x="73.0" y="65.2" text-anchor="end" font-size="12" fill="#1f2a37" font-weight="500" font-style="italic">a</text><text x="93.0" y="17.85" text-anchor="middle" font-size="11" fill="#1f2a37" font-weight="500">x = a sin θ</text><polygon points="200.0,100.0 318.0,100.0 318.0,34.0" fill="#2563eb" fill-opacity="0.12" stroke="#1f2a37" stroke-width="1.5" stroke-linejoin="round"/><path d="M311.0,100.0 L311.0,93.0 L318.0,93.0" fill="none" stroke="#1f2a37" stroke-width="1.1"/><path d="M220.0,100.0 A20,20 0 0 0 217.5,90.3" fill="none" stroke="#1f2a37" stroke-width="1.1"/><text x="225" y="99.85" text-anchor="start" font-size="11" fill="#1f2a37" font-weight="500" font-style="italic">θ</text><text x="259.0" y="119.2" text-anchor="middle" font-size="12" fill="#1f2a37" font-weight="500" font-style="italic">a</text><text x="324" y="75.2" text-anchor="start" font-size="12" fill="#1f2a37" font-weight="500" font-style="italic">x</text><text x="251.0" y="64.85" text-anchor="end" font-size="11" fill="#1f2a37" font-weight="500">√(a² + x²)</text><text x="271.0" y="17.85" text-anchor="middle" font-size="11" fill="#1f2a37" font-weight="500">x = a tan θ</text></svg>